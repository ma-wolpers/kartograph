name: Quality Checks

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # bw-gui (Keybinding-Contract, Test-Plugin) kommt als Submodul -- ohne
          # recursive fehlte es in CI bzw. lief gegen einen fremden Stand.
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run AI guardrail check
        run: python tools/ci/check_ai_guardrails.py

      - name: Run test suite
        run: python -m pytest -q
